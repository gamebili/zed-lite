[package]
name = "msvc_spectre_libs"
version = "0.1.3"
edition = "2021"
description = "msvc_spectre_libs 0.1.3, patched to warn instead of failing when the Spectre-mitigated libs are missing"
build = "build.rs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/microsoft/rust_msvc_spectre_libs"

[lib]
path = "src/lib.rs"

[target.'cfg(all(target_os = "windows", target_env = "msvc"))'.build-dependencies]
cc = "1.0"

[features]
# Upstream turns the missing-libs warning into a build error; kept so dependents still resolve.
error = []
